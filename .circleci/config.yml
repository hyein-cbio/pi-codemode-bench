version: 2.1

orbs:
  node: circleci/node@7.2.1

jobs:
  validate-macos:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium
    environment:
      CI: "true"
    steps:
      - checkout:
          method: full
      - run:
          name: Ensure complete source history
          command: |
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow
            fi
      - node/install:
          node-version: "22.23.4"
      - run:
          name: Verify required runtimes
          command: |
            node --version
            python3 --version
      - restore_cache:
          keys:
            - npm-macos-arm64-node22-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci --ignore-scripts
      - save_cache:
          key: npm-macos-arm64-node22-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run Node.js tests
          command: circleci testsuite run "node tests"
      - store_test_results:
          path: test-reports
      - run:
          name: Check repository language
          command: npm run check:language
      - run:
          name: Validate demo benchmark
          command: npm run bench:demo -- --out=results/ci-demo.json
      - run:
          name: Print allowlisted validation summary
          command: node scripts/ci-summary.mjs results/ci-demo.json
      # Do not upload raw receipts or persist the workspace.

workflows:
  benchmark-validation-macos:
    jobs:
      - validate-macos
