name: benchmark-validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:language
      - run: npm test
      - run: npm run bench:demo -- --out=results/ci-demo.json
      # Raw receipts contain paths, configuration and traces. Never upload results/.
      - name: Write allowlisted validation summary
        run: node scripts/ci-summary.mjs results/ci-demo.json >> "$GITHUB_STEP_SUMMARY"
